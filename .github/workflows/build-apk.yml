name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moy-ai-build-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Baboon APK and publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install host Vulkan shader tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
          glslc --version
          test -f /usr/include/spirv/unified1/spirv.hpp
          SPIRV_CONFIG="$(find /usr -type f -name SPIRV-HeadersConfig.cmake -print -quit)"
          if [[ -z "$SPIRV_CONFIG" ]]; then
            echo 'SPIRV-HeadersConfig.cmake missing after installing spirv-headers'
            exit 1
          fi
          echo "BABOON_SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CONFIG")" >> "$GITHUB_ENV"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_REV=f2f667b02dc76d675395ae3b14546c8108d26387
          LLAMA_DIR=android/app/src/main/cpp/llama.cpp
          mkdir -p "$LLAMA_DIR"
          git -C "$LLAMA_DIR" init
          git -C "$LLAMA_DIR" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$LLAMA_DIR" fetch --depth 1 origin "$LLAMA_REV"
          git -C "$LLAMA_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$LLAMA_DIR" rev-parse HEAD)" = "$LLAMA_REV"
      - name: Restore permanent signing key
        env:
          BABOON_KEYSTORE_BASE64: ${{ secrets.BABOON_KEYSTORE_BASE64 }}
          BABOON_STORE_PASSWORD: ${{ secrets.BABOON_STORE_PASSWORD }}
          BABOON_KEY_PASSWORD: ${{ secrets.BABOON_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BABOON_KEYSTORE_BASE64" || -z "$BABOON_STORE_PASSWORD" || -z "$BABOON_KEY_PASSWORD" ]]; then
            echo "Required GitHub Secrets missing: BABOON_KEYSTORE_BASE64, BABOON_STORE_PASSWORD, BABOON_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$BABOON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/baboon-release.p12"
          echo "BABOON_KEYSTORE_PATH=$RUNNER_TEMP/baboon-release.p12" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/baboon-release.p12" -storepass "$BABOON_STORE_PASSWORD" -alias baboon >/dev/null
      - name: Install dependencies and check Dart
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Compile signed Android release APK (arm64-v8a)
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BABOON_STORE_PASSWORD: ${{ secrets.BABOON_STORE_PASSWORD }}
          BABOON_KEY_PASSWORD: ${{ secrets.BABOON_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-name="0.3.${RUN_NUMBER}" --build-number="${RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "baboon-v0.3.${RUN_NUMBER}.apk"
          sha256sum "baboon-v0.3.${RUN_NUMBER}.apk" > "baboon-v0.3.${RUN_NUMBER}.apk.sha256"
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.${RUN_NUMBER}"
          APK="baboon-${TAG}.apk"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" "${APK}.sha256" --clobber
          else
            gh release create "${TAG}" "${APK}" "${APK}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "Бабуин ${TAG}" \
              --notes "Бабуин: встроенные обновления через GitHub Releases, локальный Qwen, ручная сборка, экспериментальный Vulkan GPU. Подписано постоянным ключом." \
              --latest
          fi
