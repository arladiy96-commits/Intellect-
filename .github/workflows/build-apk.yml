name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moy-ai-build-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish APK to Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify bootstrap completed
        shell: bash
        run: |
          test -f pubspec.yaml || { echo "::error::First run Flutter Bootstrap."; exit 1; }
          test -d android || { echo "::error::Android project is missing."; exit 1; }
      - name: Install dependencies and run checks
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Compile Android release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --build-name="0.1.${RUN_NUMBER}" --build-number="${RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "moy-ai-v0.1.${RUN_NUMBER}.apk"
      - name: Publish directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.${RUN_NUMBER}"
          APK="moy-ai-${TAG}.apk"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" --clobber
          else
            gh release create "${TAG}" "${APK}" \
              --target "${GITHUB_SHA}" \
              --title "Мой ИИ ${TAG}" \
              --notes "Ручная сборка Android APK. Первая версия — интерфейсный каркас; локальный движок llama.cpp пока не подключён. Тестовая подпись: для обновлений потребуется постоянный ключ." \
              --prerelease
          fi
