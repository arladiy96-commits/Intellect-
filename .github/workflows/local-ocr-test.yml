name: Local OCR test (PP-OCRv5)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-ocr-test.yml'

permissions:
  contents: read

concurrency:
  group: baboon-local-ocr-test
  cancel-in-progress: false

jobs:
  build:
    name: Build separate offline Russian OCR demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download pinned open-source PP-OCRv5 demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream-ocr
          git -C upstream-ocr init
          git -C upstream-ocr remote add origin https://github.com/i30mb1/PPOCRv5-Android.git
          git -C upstream-ocr fetch --depth 1 origin 621f0f99d014c6611b763040bc7e701c14638aca
          git -C upstream-ocr checkout --detach FETCH_HEAD
          test "$(git -C upstream-ocr rev-parse HEAD)" = '621f0f99d014c6611b763040bc7e701c14638aca'
          test -s upstream-ocr/app/src/main/assets/models/ocr_det_fp16.tflite
          test -s upstream-ocr/app/src/main/assets/models/ocr_rec_fp16.tflite
          test -s upstream-ocr/app/src/main/assets/models/keys_eslav.txt

      - name: Install Android SDK and native build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1" "build-tools;36.1.0"

      - name: Update demo compile API for current AndroidX libraries
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-ocr
          # Keep the upstream API level 36 while pinning AndroidX Core to
          # a version compatible with that SDK (new transitive 1.19 needs API 37).
          grep -q 'coreKtx = "1.18.0"' gradle/libs.versions.toml
          sed -i 's/coreKtx = "1.18.0"/coreKtx = "1.17.0"/' gradle/libs.versions.toml
          printf '%s\n' 'configurations.configureEach {' '  resolutionStrategy.force("androidx.core:core:1.17.0", "androidx.core:core-ktx:1.17.0")' '}' >> app/build.gradle.kts

      - name: Build Android debug APK (test only)
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-ocr
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../baboon-ocr-test.apk
          cd ..
          sha256sum baboon-ocr-test.apk > baboon-ocr-test.apk.sha256

      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: baboon-ocr-test
          path: |
            baboon-ocr-test.apk
            baboon-ocr-test.apk.sha256
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish isolated test APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: baboon-ocr-test

      - name: Publish test release (does not replace Baboon)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='ocr-test-v1'
          NOTES='Separate experimental PP-OCRv5 Android application for measuring offline Russian OCR quality and speed. Original source: https://github.com/i30mb1/PPOCRv5-Android (Apache-2.0), pinned at 621f0f99d014c6611b763040bc7e701c14638aca. This APK is not Baboon and does not modify Baboon data. Test with non-sensitive images until the third-party implementation has been audited.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" baboon-ocr-test.apk baboon-ocr-test.apk.sha256 --clobber
          else
            gh release create "$TAG" baboon-ocr-test.apk baboon-ocr-test.apk.sha256 \
              --target "${{ github.sha }}" \
              --title 'Бабуин — тест локального OCR (PP-OCRv5)' \
              --notes "$NOTES" --latest=false
          fi
